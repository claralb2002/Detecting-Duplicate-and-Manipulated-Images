[project]
name = "near-duplicates"
version = "0.1.0"
description = "Near-duplicate image detection at scale: perceptual hashing versus visual-word MinHash LSH"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "threadpoolctl>=3.7.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "imagehash>=4.3.2",
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
